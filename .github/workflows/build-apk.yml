name: Build Android debug APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          npm install
          npm install --save-dev @capacitor/cli @capacitor/android

      - name: Prepare Web Assets for Capacitor
        run: |
          mkdir -p www
          cp index.html www/ 2>/dev/null || true
          cp -r js css assets img 2>/dev/null || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Add Android Platform and Build
        run: |
          npx --yes @capacitor/cli add android || true
          npx --yes @capacitor/cli sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --refresh-dependencies --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
