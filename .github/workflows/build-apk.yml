name: Build Android debug APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          npm install
          npm install --save-dev @capacitor/cli @capacitor/android

      - name: Prepare Web Assets for Capacitor
        run: |
          mkdir -p www
          cp index.html www/ 2>/dev/null || true
          cp -r js css assets img 2>/dev/null || true

      - name: Set up JDK 18
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '18'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Add Android Platform and Sync
        run: |
          rm -rf android/
          npx --yes @capacitor/cli add android
          npx --yes @capacitor/cli sync android

      - name: Force Clean and Build APK
        run: |
          cd android
          chmod +x gradlew
          # Force gradle to ignore corrupted checksums and rebuild jars cleanly
          ./gradlew assembleDebug --refresh-dependencies --no-daemon -Dorg.gradle.daemon=false
        env:
          ORG_GRADLE_PROJECT_kotlin_version: '1.9.24'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
